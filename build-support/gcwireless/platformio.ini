; Our own build wrapper for upstream/gcwireless (the submodule stays untouched).
; Defines the PIN_0xx / PIN_1xx names the upstream code uses and a stand-in nicenano board.
[platformio]
src_dir = ../../upstream/gcwireless/src
boards_dir = ../boards

[env]
platform = nordicnrf52
board = nicenano
framework = arduino
build_flags = -include pins.h -I.
lib_deps =
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library

[env:pro_micro_tx]
build_flags = ${env.build_flags} -DTX_MODE

[env:pro_micro_rx]
build_flags = ${env.build_flags} -DRX_MODE
